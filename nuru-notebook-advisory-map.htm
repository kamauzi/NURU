<script>
(function () {
    var nuruMap = map_ffc4482f259f88b193006a44d8ac390a;
    var notebookOsm = tile_layer_c0fc97b514f3dd816e878e1559aac6ef;

    // Satellite imagery is the default context layer; the notebook OSM layer remains selectable.
    var nuruSatellite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
            crossOrigin: true
        }
    ).addTo(nuruMap);
    nuruMap.removeLayer(notebookOsm);

    // Coastline is geographic context only and sits below the scientific overlays/targets.
    var coastlinePane = nuruMap.createPane("nuruCoastlinePane");
    coastlinePane.style.zIndex = 350;

    var originalLayerControl = layer_control_96cb7e479151b6ffaafa568d7ad955ba;
    if (originalLayerControl) nuruMap.removeControl(originalLayerControl);
    var baseLayers = {
        "Satellite imagery": nuruSatellite,
        "OpenStreetMap": notebookOsm
    };
    var overlayLayers = {
        "Target analysis area": geo_json_c0fb85076856541a20a88486a61c8bd1,
        "Smoothed fishing suitability": image_overlay_00c18f92f257649b05c84e19117eb912,
        "Sea Surface Temperature (SST)": image_overlay_76a876b9fbf295b66cd38ae4f1c69606,
        "Chlorophyll-a": image_overlay_0fb7b1a4bc6596fef871c7259f91c2e9,
        "Landing / start locations": feature_group_83a9fb143c17081960487f0f39977b4e,
        "Potential fishing hotspots": feature_group_f9ae00ba73392e6944c7951cfecdaf26
    };
    var nuruLayerControl = L.control.layers(baseLayers, overlayLayers, {
        position: "topright",
        collapsed: false,
        autoZIndex: true
    }).addTo(nuruMap);

    fetch("/nuru-coastline.geojson")
        .then(function (response) { return response.json(); })
        .then(function (data) {
            var coastlineLayer = L.geoJSON(data, {
                pane: "nuruCoastlinePane",
                interactive: false,
                style: { color: "#244b5a", weight: 1.6, opacity: 0.82 }
            }).addTo(nuruMap);
            nuruLayerControl.addOverlay(coastlineLayer, "Natural Earth 10m coastline");
        })
        .catch(function (error) { console.warn("Nuru coastline layer unavailable", error); });

    // Let the advisor-view button control only the display surface. Hotspot ranking is unchanged.
    window.addEventListener("message", function (event) {
        if (event.source !== window.parent || event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== "nuru-suitability-display") return;
        if (event.data.visible) {
            if (!nuruMap.hasLayer(image_overlay_00c18f92f257649b05c84e19117eb912)) image_overlay_00c18f92f257649b05c84e19117eb912.addTo(nuruMap);
        } else if (nuruMap.hasLayer(image_overlay_00c18f92f257649b05c84e19117eb912)) {
            nuruMap.removeLayer(image_overlay_00c18f92f257649b05c84e19117eb912);
        }
    });

    // Forward notebook hotspot clicks to the fisher-facing selected-area panel.
    var hotspotMarkers = [
        [circle_2da57daa92cb38423beb5acf539d993f, circle_marker_d115cee8893f090ff153b24d4cb6e92c, "HOTSPOT-01"],
        [circle_9a9d1f101143d1b19cdf08756ff18f35, circle_marker_bd6195a115cecd4168b91e5b1ed1e544, "HOTSPOT-02"],
        [circle_b1354751eefdf9c018c61614daea1fc2, circle_marker_51f3df7a40633789b24c66983a50328a, "HOTSPOT-03"],
        [circle_5a5474d613e4d509ee2dbc763dd776f4, circle_marker_2ce152bbaa0796cab55a5bcbc8d8edf4, "HOTSPOT-04"],
        [circle_6a9182d0b5c8af51f126e02b9237c02f, circle_marker_2dda0eca7b192a7ba112da797f5daf11, "HOTSPOT-05"],
        [circle_14f130f592a4b077eca733ee5c430ead, circle_marker_84401e27d86323db45176a35ef0f1834, "HOTSPOT-06"],
        [circle_9462a1bac31d7400a4852dda77c2c6a7, circle_marker_95382fd48bb1e9e4db334630861f7332, "HOTSPOT-07"]
    ];
    hotspotMarkers.forEach(function (entry) {
        [entry[0], entry[1]].forEach(function (layer) {
            layer.on("click", function () {
                window.parent.postMessage({ type: "nuru-hotspot-select", target_id: entry[2] }, window.location.origin);
            });
        });
    });
})();
